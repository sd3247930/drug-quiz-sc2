<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a5fb4">
<meta name="description" content="药品管理相关法规知识竞赛试题库（生产二部专用）——本地刷题工具，支持顺序练习、随机练习、错题本与统计，进度保存在本机浏览器。">
<title>药品管理相关法规知识竞赛试题库（生产二部专用）</title>
<style>
/* ============================================================
   CSS 区：页面样式
   - 视觉风格沿用早期原型：蓝色主色 #1a5fb4、白色卡片、圆角
   - 手机适配：按钮最小高度 48px，正文字号 16px（不小于 14px）
   ============================================================ */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: #f0f4f8;
    margin: 0;
    padding: 16px;
    color: #222;
    font-size: 16px;
    line-height: 1.6;
  }
  .app {
    max-width: 760px;
    margin: 0 auto;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    padding: 20px;
  }
  h1 { font-size: 19px; line-height: 1.4; text-align: center; color: #1a5fb4; margin: 4px 0; }
  .subtitle { text-align: center; color: #8a94a6; font-size: 13px; margin-bottom: 18px; }

  /* 进度提示文字 */
  .progress { font-size: 14px; color: #5b6472; text-align: center; margin: 0 0 10px; }
  .summary { font-size: 14px; color: #5b6472; text-align: center; margin: 0 0 16px; }

  /* 主菜单按钮 */
  .menu-btn {
    display: block; width: 100%; min-height: 48px; padding: 12px 14px; margin: 10px 0;
    font-size: 16px; font-family: inherit; border: none; border-radius: 8px;
    background: #1a5fb4; color: #fff; cursor: pointer; transition: background .15s;
  }
  .menu-btn:hover { background: #154a8a; }
  .menu-btn:active { transform: scale(0.995); }
  .menu-btn.gray { background: #5c6672; }
  .menu-btn.gray:hover { background: #4a535e; }
  .menu-btn.red { background: #c0392b; }
  .menu-btn.red:hover { background: #992d22; }

  /* 答题页 */
  .q-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 6px 0 2px; }
  .type-tag { display: inline-block; background: #e8f0fe; color: #1a5fb4; font-size: 13px; padding: 3px 10px; border-radius: 6px; }
  .q-no { font-size: 13px; color: #8a94a6; }
  .question { font-size: 17px; line-height: 1.6; margin: 10px 0 12px; font-weight: 600; }
  .option {
    display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; margin: 8px 0;
    border: 2px solid #d0d7de; border-radius: 8px; background: #fafbfc;
    cursor: pointer; font-size: 15px; line-height: 1.5;
  }
  .option:hover { border-color: #1a5fb4; background: #f0f6ff; }
  .option input { width: 18px; height: 18px; margin: 3px 0 0; flex: 0 0 auto; }
  .option.selected { border-color: #1a5fb4; background: #dceafd; }
  .option.correct { border-color: #2e7d32; background: #e6f4ea; }
  .option.wrong { border-color: #c0392b; background: #fdecea; }
  .option.disabled { cursor: default; }

  /* 按钮行 */
  .btn-row { display: flex; gap: 10px; margin-top: 16px; }
  .btn-row button { flex: 1; min-height: 48px; font-size: 16px; font-family: inherit; border: none; border-radius: 8px; cursor: pointer; }
  .btn-primary { background: #1a5fb4; color: #fff; }
  .btn-primary:hover { background: #154a8a; }
  .btn-secondary { background: #e9ecef; color: #333; }
  .btn-secondary:hover { background: #dde2e6; }
  .btn-secondary.small { flex: 0 0 auto; min-height: 40px; padding: 0 16px; font-size: 14px; margin-top: 10px; }

  /* 答题结果提示 */
  .result { margin-top: 14px; padding: 12px 14px; border-radius: 8px; font-size: 15px; line-height: 1.6; }
  .result.ok { background: #e6f4ea; color: #256b29; }
  .result.bad { background: #fdecea; color: #b02a1f; }

  /* 错题本 */
  .wrong-row { border: 1px solid #e5eaf0; border-radius: 8px; padding: 12px 14px; margin: 10px 0; background: #fcfdff; }
  .wrong-title { font-size: 14px; color: #1a5fb4; font-weight: 600; }
  .wrong-detail { font-size: 15px; line-height: 1.5; margin-top: 6px; color: #333; }
  .wrong-meta { font-size: 13px; color: #8a94a6; margin-top: 8px; }

  /* 统计 */
  .stat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .stat-item { background: #f8f9fb; border: 1px solid #e5eaf0; border-radius: 8px; padding: 12px; }
  .stat-label { font-size: 13px; color: #8a94a6; }
  .stat-value { font-size: 20px; font-weight: 600; color: #1a5fb4; margin-top: 2px; }
  .stat-section { margin-top: 18px; font-size: 15px; font-weight: 600; color: #333; }

  .hint { font-size: 13px; color: #8a94a6; margin-top: 10px; }
  .hidden { display: none !important; }
  .footer { text-align: center; font-size: 12px; color: #9aa3af; margin-top: 18px; line-height: 1.6; }

  /* 轻提示（例如"请先选择答案"） */
  .toast {
    position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%);
    background: rgba(30, 35, 45, 0.92); color: #fff; padding: 10px 18px;
    border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .25s;
    pointer-events: none; z-index: 99; max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; }

  /* 手机适配 */
  @media (max-width: 480px) {
    body { padding: 10px; }
    .app { padding: 14px; border-radius: 10px; }
    h1 { font-size: 17px; }
    .question { font-size: 16px; }
    .stat-value { font-size: 18px; }
  }
</style>
</head>
<body>

<!-- ============================================================
     HTML 区：四个页面（主菜单 / 答题 / 错题本 / 统计）
     同一时刻只显示其中一个，用 .hidden 控制
     ============================================================ -->
<div class="app">
  <h1>药品管理相关法规知识竞赛试题库（生产二部专用）</h1>
  <div class="subtitle">生产二部 · 法规知识竞赛刷题</div>

  <!-- 主菜单 -->
  <div id="menu">
    <div class="progress" id="menuProgress"></div>
    <div class="summary" id="menuSummary"></div>
    <button class="menu-btn" id="btnFull" onclick="startFullQuiz()">顺序做全部题目</button>
    <button class="menu-btn" onclick="startRandomQuiz()">随机练习（打乱题目顺序）</button>
    <button class="menu-btn" onclick="startWrongQuiz()">错题练习（只做错题）</button>
    <button class="menu-btn gray" onclick="showWrongBook()">查看错题本</button>
    <button class="menu-btn gray" onclick="showStats()">查看统计</button>
    <button class="menu-btn red" onclick="resetAll()">清空所有记录（重新开始）</button>
  </div>

  <!-- 答题页 -->
  <div id="quiz" class="hidden">
    <div class="progress" id="quizProgress"></div>
    <div class="q-head">
      <span class="type-tag" id="questionType"></span>
      <span class="q-no" id="questionNo"></span>
    </div>
    <div class="question" id="questionText"></div>
    <div id="options"></div>
    <div class="result hidden" id="resultBox"></div>
    <div class="btn-row">
      <button class="btn-secondary" onclick="backToMenu()">返回菜单</button>
      <button class="btn-primary" id="submitBtn" onclick="submitAnswer()">提交答案</button>
      <button class="btn-primary hidden" id="nextBtn" onclick="nextQuestion()">下一题</button>
    </div>
  </div>

  <!-- 错题本 -->
  <div id="wrongBook" class="hidden">
    <div class="progress" id="wrongBookProgress"></div>
    <div id="wrongList"></div>
    <div class="btn-row">
      <button class="btn-secondary" onclick="backToMenu()">返回菜单</button>
      <button class="btn-primary" onclick="startWrongQuiz()">开始错题重练</button>
    </div>
    <div class="hint">提示：在错题练习中把这题答对，会自动移出错题本。</div>
  </div>

  <!-- 统计页 -->
  <div id="stats" class="hidden">
    <div id="statsContent"></div>
    <div class="btn-row">
      <button class="btn-secondary" onclick="backToMenu()">返回菜单</button>
    </div>
  </div>

  <div class="footer">
    练习进度、错题本、统计只保存在这台设备的浏览器里，不上传任何服务器。<br>
    换手机或清除浏览器数据后，记录会丢失。
  </div>
</div>

<!-- 轻提示条 -->
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   一、题库区（QUESTION_BANK）
   - 共 300 题：单选 190 题、多选 110 题
   - 每题结构：{ type: "单选"|"多选", question: "题干", options: ["A. xx", ...], answer: ["C"] }
   - answer 已按字母升序，判分时直接与所选字母比较
   - 数据来源：private/DOCTYPE html.docx，由 tools/extract-bank.py 抽取并校验
   ============================================================ */
const QUESTION_BANK = [
{"type":"单选","question":"对申请注册的药品，国务院药品监督管理部门应当组织药学、医学和其他技术人员进行审评，对药品的安全性、有效性和质量可控性以及申请人的质量管理、风险防控和责任赔偿等能力进行审查；符合条件的，颁发（ ）。","options":["A. 药品生产许可证","B. 药品经营许可证","C. 药品注册证书","D. 营业执照"],"answer":["C"]},
{"type":"单选","question":"根据《关于进一步完善药品关联审评审批和监管工作有关事宜的公告》2019年第56号公告，标识为\"I\"的原辅包是指什么？","options":["A. 已通过技术审评","B. 通过技术审评或尚未与制剂注册进行关联","C. 未通过技术审评","D. 免予登记"],"answer":["B"]},
{"type":"单选","question":"工艺规程的制定应当以（ ）的工艺为依据。","options":["A. 国家批准","B. 注册批准","C. 企业批准","D. 内控标准"],"answer":["B"]},
{"type":"单选","question":"药品生产企业应当建立药品出厂放行规程，明确出厂放行的标准、条件。符合标准、条件的，经（ ）签字后方可放行。","options":["A. 质量负责人","B. 生产负责人","C. 质量受权人","D. 企业法人"],"answer":["C"]},
{"type":"单选","question":"以电子数据为主数据时，存储的电子数据应当能够满足（ ）目的而打印成清晰易懂的文件？","options":["A. 质量审计","B. 财务审计","C. 环保审计","D. 安全审计"],"answer":["A"]},
{"type":"单选","question":"药品生产、经营企业和医疗机构发现或者获知新的、严重的药品不良反应应当在几日内报告？","options":["A. 7日内","B. 15日内","C. 30日内","D. 60日内"],"answer":["B"]},
{"type":"单选","question":"药品批发企业在药品入库验收时，必须进行的追溯操作是？","options":["A. 追溯码核对","B. 追溯码激活","C. 追溯码打印","D. 追溯码注销"],"answer":["A"]},
{"type":"单选","question":"根据《药品注册核查要点与判定原则（药学研制和生产现场）（试行）》，关键批次样品试制用的原辅料及直接接触药品的包装材料和容器应当有什么？","options":["A. 供应商推荐信","B. 检验报告书","C. 出厂合格证","D. 进口许可证"],"answer":["B"]},
{"type":"单选","question":"药品生产企业应当对药品进行质量（ ）。不符合国家药品标准的，不得出厂。","options":["A. 保证","B. 检验","C. 管理","D. 以上都对"],"answer":["B"]},
{"type":"单选","question":"《放射性药品生产许可证》、《放射性药品经营许可证》的有效期为？","options":["A. 3年","B. 4年","C. 5年","D. 6年"],"answer":["C"]},
{"type":"单选","question":"按照规定报告所发现的药品不良反应的主体不包括以下哪个？","options":["A. 药品生产企业","B. 药品经营企业","C. 药品零售个体户","D. 医疗机构"],"answer":["C"]},
{"type":"单选","question":"备案类变更应当由持有人向药审中心或省级药品监管部门备案。备案部门应当自备案完成之日起（ ）内公示有关信息。","options":["A. 10日","B. 20日","C. 5日","D. 3日"],"answer":["C"]},
{"type":"单选","question":"以下情形属于劣药的是（ ）。","options":["A. 标注虚假的药品批准文号、药品上市许可持有人的","B. 使用其他药品的名称或者批准文号","C. 未注明或者更改产品批号的药品","D. 在标签、说明书上标注不具有的适应症或者功能主治的"],"answer":["C"]},
{"type":"单选","question":"以下情形属于劣药的是（ ）。","options":["A. 药品成份的含量不符合国家药品标准","B. 药品所含成份与国家药品标准规定的成份不符","C. 以非药品冒充药品或者以他种药品冒充此种药品","D. 药品所标明的适应症或者功能主治超出规定范围"],"answer":["A"]},
{"type":"单选","question":"从事药品生产活动，应当经（ ）批准，取得药品生产许可证。无药品生产许可证的，不得生产药品。","options":["A. 行业协会","B. 所在地省、自治区、直辖市人民政府药品监督管理部门","C. 国务院药品监督管理部门","D. 药品上市许可持有人"],"answer":["B"]},
{"type":"单选","question":"患有传染病或者其他可能污染药品的疾病的，不得从事（ ）。","options":["A. 所有药品生产工作","B. 非直接接触药品的工作","C. 直接接触药品的工作","D. 药品管理工作"],"answer":["C"]},
{"type":"单选","question":"工艺验证批的批量应当与什么一致？","options":["A. 预定的商业批的批量","B. 最小批量","C. 最大批量","D. 中试批量"],"answer":["A"]},
{"type":"单选","question":"根据《药品经营和使用质量监督管理办法》，药品经营企业不得经营下列哪种药品？","options":["A. 中成药","B. 疫苗","C. 化学药","D. 中药饮片"],"answer":["B"]},
{"type":"单选","question":"申请药品生产许可、药品经营许可、药品注册等许可时，提供虚假证明、数据、资料、样品或者采取其他欺骗手段的，县级以上人民政府药品监督管理部门不予受理或者不予许可，（ ）内不受理其相应申请。","options":["A. 5年","B. 10年","C. 15年","D. 20年"],"answer":["B"]},
{"type":"单选","question":"放射性成品留样量应当能够满足什么？","options":["A. 注册批准的质量标准1倍的全检量","B. 注册批准的质量标准2倍的全检量","C. 注册批准的质量标准3倍的全检量","D. 仅鉴别需要量"],"answer":["B"]},
{"type":"单选","question":"持有人应当在提出变更的补充申请时承诺变更获得批准后的实施时间，实施时间原则上最长不得超过自变更获批之日起（ ），涉及药品安全性变更的事项除外，具体以药品补充申请通知书载明的实施日期为准。","options":["A. 3个月","B. 6个月","C. 9个月","D. 12个月"],"answer":["B"]},
{"type":"单选","question":"参观人员和未经培训的人员不得进入（ ），特殊情况确需进入的，应当事先对个人卫生、更衣等事项进行指导。","options":["A. 生产区","B. 质量控制区","C. 仓库","D. 生产区和质量控制区"],"answer":["D"]},
{"type":"单选","question":"持有人、生产企业等应当确保追溯数据的？","options":["A. 及时性、准确性、完整性","B. 真实性、有效性、可追溯性","C. 安全性、保密性、完整性","D. 唯一性、关联性、可核查性"],"answer":["A"]},
{"type":"单选","question":"应当保存厂房、公用设施、固定管道建造或改造后的（ ）。","options":["A. 图纸","B. 设计图纸","C. 施工图纸","D. 竣工图纸"],"answer":["D"]},
{"type":"单选","question":"《GMP附录-无菌药品》中，无菌药品是指什么？","options":["A. 法定药品标准中列有无菌检查项目的制剂和原料药","B. 所有注射剂","C. 所有口服制剂","D. 所有外用制剂"],"answer":["A"]},
{"type":"单选","question":"从事药品研制、生产、经营、使用活动，应当遵守法律、法规、规章、标准和规范，保证全过程信息真实、准确、完整和（ ）。","options":["A. 可追溯","B. 合理","C. 科学","D. 有效"],"answer":["A"]},
{"type":"单选","question":"所有人员应当明确并理解自己的职责，熟悉与其职责相关的要求，并接受必要的培训，包括（ ）培训和继续培训。","options":["A. 上岗前","B. 上岗后","C. 外部","D. 职责"],"answer":["A"]},
{"type":"单选","question":"药品生产过程中的重大变更，应当经国务院药品监督管理部门（ ）。","options":["A. 批准","B. 备案","C. 登记","D. 报告"],"answer":["A"]},
{"type":"单选","question":"系统生成的数据应当定期备份，备份与（ ）流程必须经过验证？","options":["A. 传输","B. 恢复","C. 归档","D. 销毁"],"answer":["B"]},
{"type":"单选","question":"储存放射性药品应当实行什么储存保管方式？","options":["A. 单人单锁","B. 双人单锁","C. 双人双锁","D. 专人管理"],"answer":["C"]},
{"type":"单选","question":"药品生产企业可能会在（ ）情形下，收到药品监管部门的告诫信。","options":["A. 生产活动基本符合法律法规，暂不需要整改","B. 药品生产中有存在安全隐患的可能性，但尚未发现相关证据","C. 有证据证明可能存在安全隐患","D. 发生重大安全事件"],"answer":["C"]},
{"type":"单选","question":"质量风险管理是在整个产品生命周期中采用（ ）的方式，对质量风险进行评估、控制、沟通、审核的系统过程。","options":["A. 前瞻","B. 回顾","C. 前瞻或回顾","D. 定期汇总"],"answer":["C"]},
{"type":"单选","question":"国家支持以（ ）为导向、对人的疾病具有明确或者特殊疗效的药物创新。","options":["A. 临床价值","B. 临床效果","C. 商业价值","D. 药品价值"],"answer":["A"]},
{"type":"单选","question":"药品应当按照国家药品标准和经药品监督管理部门核准的（ ）进行生产。","options":["A. 操作规程","B. 生产工艺","C. 批记录","D. 批指令"],"answer":["B"]},

/* ============================================================
   二、存储区（localStorage）
   - 三个固定键名，未来升级 PWA 时保持不变，避免进度丢失
   - 浏览器禁用本地存储时自动退化为"内存存储"，页面仍可正常使用
   - 所有读取失败都回退默认值，绝不抛错打断页面
   ============================================================ */
const KEY_DATA = "drug_quiz_data";         /* 顺序练习进度 + 每题作答记录 */
const KEY_WRONG = "drug_quiz_wrong";       /* 错题本 + 每题答错次数 */
const KEY_SETTINGS = "drug_quiz_settings"; /* 用户设置（练习模式等） */

/* 探测 localStorage 是否可用（隐私模式等场景可能被禁用） */
let storageAvailable = true;
try {
  window.localStorage.setItem("__drug_quiz_probe__", "1");
  window.localStorage.removeItem("__drug_quiz_probe__");
} catch (err) {
  storageAvailable = false;
}

/* 内存兜底存储：localStorage 不可用时改用内存，页面功能不受影响 */
const memoryStore = {};

/** 读取原始字符串；失败返回 null */
function readRaw(key) {
  if (storageAvailable) {
    try { return window.localStorage.getItem(key); } catch (err) { return null; }
  }
  return Object.prototype.hasOwnProperty.call(memoryStore, key) ? memoryStore[key] : null;
}

/** 写入原始字符串；失败静默忽略 */
function writeRaw(key, value) {
  if (storageAvailable) {
    try { window.localStorage.setItem(key, value); } catch (err) { /* 忽略写入失败 */ }
  } else {
    memoryStore[key] = value;
  }
}

/** 删除某个键 */
function removeRaw(key) {
  if (storageAvailable) {
    try { window.localStorage.removeItem(key); } catch (err) { /* 忽略 */ }
  } else {
    delete memoryStore[key];
  }
}

/** 读取 JSON；解析失败或格式非法时返回默认值 */
function loadJSON(key, fallback) {
  const raw = readRaw(key);
  if (!raw) return fallback;
  try {
    const obj = JSON.parse(raw);
    return (obj && typeof obj === "object") ? obj : fallback;
  } catch (err) {
    return fallback;
  }
}

/** 保存 JSON */
function saveJSON(key, obj) {
  writeRaw(key, JSON.stringify(obj));
}

/* ---------- 默认数据结构 ---------- */
function defaultData() { return { currentIndex: 0, records: {} }; }
function defaultWrong() { return { wrongIndices: [], wrongCount: {} }; }
function defaultSettings() { return { mode: "full" }; }

/**
 * 校正答题记录结构（防止旧数据/手工改动导致页面出错）
 * records 结构：{ 题目索引: { selected: ["C"], correct: true, attempts: 2, timestamp: 1710000000000 } }
 */
function normalizeData(raw) {
  const out = defaultData();
  if (typeof raw.currentIndex === "number" && isFinite(raw.currentIndex)) {
    out.currentIndex = Math.min(Math.max(Math.floor(raw.currentIndex), 0), BANK_SIZE);
  }
  const records = raw.records;
  if (records && typeof records === "object") {
    Object.keys(records).forEach(function (key) {
      const id = Number(key);
      const item = records[key];
      if (!isFinite(id) || id < 0 || id >= BANK_SIZE || !item || typeof item !== "object") return;
      out.records[id] = {
        selected: Array.isArray(item.selected) ? item.selected.filter(function (x) { return typeof x === "string"; }) : [],
        correct: item.correct === true,
        attempts: (typeof item.attempts === "number" && item.attempts > 0) ? Math.floor(item.attempts) : 1,
        timestamp: (typeof item.timestamp === "number") ? item.timestamp : 0
      };
    });
  }
  return out;
}

/** 校正错题本结构 */
function normalizeWrong(raw) {
  const out = defaultWrong();
  const seen = {};
  if (Array.isArray(raw.wrongIndices)) {
    raw.wrongIndices.forEach(function (id) {
      if (typeof id === "number" && isFinite(id) && id >= 0 && id < BANK_SIZE && !seen[id]) {
        seen[id] = true;
        out.wrongIndices.push(id);
      }
    });
    out.wrongIndices.sort(function (a, b) { return a - b; });
  }
  if (raw.wrongCount && typeof raw.wrongCount === "object") {
    Object.keys(raw.wrongCount).forEach(function (key) {
      const n = raw.wrongCount[key];
      if (isFinite(Number(key)) && typeof n === "number" && n > 0) {
        out.wrongCount[key] = Math.floor(n);
      }
    });
  }
  return out;
}

/* 全局数据（页面加载时从本地读取，失败即用默认值） */
let appData = normalizeData(loadJSON(KEY_DATA, defaultData()));
let wrongData = normalizeWrong(loadJSON(KEY_WRONG, defaultWrong()));
let settings = Object.assign(defaultSettings(), loadJSON(KEY_SETTINGS, {}));

/* ============================================================
   三、状态区
   mode：本次练习模式 full=顺序 / random=随机 / wrong=错题
   order：本次练习的题目顺序（元素是题库索引）
   cursor：当前在 order 中的位置
   ============================================================ */
const MODE_NAME = { full: "顺序练习", random: "随机练习", wrong: "错题练习" };
let mode = "full";
let order = [];
let cursor = 0;
let selected = [];
let answered = false;
let sessionTotal = 0;   /* 本轮已作答题数 */
let sessionCorrect = 0; /* 本轮答对题数 */

/* ============================================================
   四、工具区
   ============================================================ */
/** 按 id 取元素 */
function $(id) { return document.getElementById(id); }
/** 显示某个区块 */
function show(id) { $(id).classList.remove("hidden"); }
/** 隐藏某个区块 */
function hide(id) { $(id).classList.add("hidden"); }

/** 数组洗牌（返回新数组，不修改原数组） */
function shuffleArray(arr) {
  const out = arr.slice();
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = out[i]; out[i] = out[j]; out[j] = tmp;
  }
  return out;
}

/** 生成 [0, n) 的索引数组 */
function rangeArray(n) {
  const out = [];
  for (let i = 0; i < n; i++) out.push(i);
  return out;
}

/** 百分比文本；分母为 0 时显示 "—" */
function formatPercent(part, total) {
  if (!total) return "—";
  return (part / total * 100).toFixed(1) + "%";
}

/** 底部轻提示 */
let toastTimer = null;
function showToast(text) {
  const el = $("toast");
  el.textContent = text;
  el.classList.add("show");
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.classList.remove("show"); }, 2200);
}

/* ============================================================
   五、菜单区
   ============================================================ */
/** 已作答题目数（题库中至少答过一次的题目数量） */
function countAnswered() {
  return Object.keys(appData.records).length;
}

/** 最近一次作答的正确率文本 */
function latestAccuracyText() {
  let answeredCount = 0, correctCount = 0;
  Object.keys(appData.records).forEach(function (key) {
    answeredCount++;
    if (appData.records[key].correct) correctCount++;
  });
  return formatPercent(correctCount, answeredCount);
}

/** 刷新主菜单上的进度与概览文字 */
function updateMenuProgress() {
  if (appData.currentIndex >= BANK_SIZE) {
    $("menuProgress").textContent = "顺序练习：已完成全部 " + BANK_SIZE + " 题（可以重新练一轮）";
  } else {
    $("menuProgress").textContent = "当前进度：第 " + (appData.currentIndex + 1) + " 题 / 共 " + BANK_SIZE + " 题";
  }
  $("menuSummary").textContent = "已答 " + countAnswered() + " 题 · 错题 " + wrongData.wrongIndices.length +
    " 题 · 最近一次正确率 " + latestAccuracyText();
  /* 题数动态显示，避免题库变化后文案写死出错 */
  $("btnFull").textContent = "顺序做全部 " + BANK_SIZE + " 题";
}

/** 返回主菜单 */
function backToMenu() {
  hide("quiz"); hide("stats"); hide("wrongBook");
  show("menu");
  updateMenuProgress();
  window.scrollTo(0, 0);
}

/* ============================================================
   六、答题区
   ============================================================ */
/** 记录当前练习模式到设置里 */
function rememberMode(newMode) {
  mode = newMode;
  settings.mode = newMode;
  saveJSON(KEY_SETTINGS, settings);
}

/** 顺序练习：从上次进度继续 */
function startFullQuiz() {
  rememberMode("full");
  order = rangeArray(BANK_SIZE);
  sessionTotal = 0; sessionCorrect = 0;
  if (appData.currentIndex >= BANK_SIZE) {
    appData.currentIndex = 0;
    saveJSON(KEY_DATA, appData);
  }
  cursor = appData.currentIndex;
  enterQuiz();
}

/** 随机练习：打乱顺序，从第 1 题开始（不影响顺序练习的进度） */
function startRandomQuiz() {
  rememberMode("random");
  order = shuffleArray(rangeArray(BANK_SIZE));
  cursor = 0;
  sessionTotal = 0; sessionCorrect = 0;
  enterQuiz();
}

/** 错题练习：只做错题本里的题 */
function startWrongQuiz() {
  const ids = wrongData.wrongIndices.slice().sort(function (a, b) { return a - b; });
  if (ids.length === 0) {
    showToast("错题本是空的，先做一遍题目吧");
    return;
  }
  rememberMode("wrong");
  order = ids;
  cursor = 0;
  sessionTotal = 0; sessionCorrect = 0;
  enterQuiz();
}

/** 进入答题页 */
function enterQuiz() {
  hide("menu"); hide("stats"); hide("wrongBook");
  show("quiz");
  renderQuestion();
}

/** 渲染当前题目 */
function renderQuestion() {
  const qid = order[cursor];
  const q = QUESTION_BANK[qid];
  selected = [];
  answered = false;

  $("quizProgress").textContent = MODE_NAME[mode] + " · 第 " + (cursor + 1) + " / " + order.length + " 题";
  $("questionType").textContent = (q.type === "多选") ? "多选题（选全才算对）" : "单选题";
  $("questionNo").textContent = "题库第 " + (qid + 1) + " 题 / 共 " + BANK_SIZE + " 题";
  $("questionText").textContent = q.question;

  renderOptions(q);

  const box = $("resultBox");
  box.textContent = "";
  box.className = "result hidden";

  const submitBtn = $("submitBtn");
  submitBtn.classList.remove("hidden");
  submitBtn.onclick = submitAnswer;

  const nextBtn = $("nextBtn");
  nextBtn.classList.add("hidden");
  nextBtn.onclick = nextQuestion;

  window.scrollTo(0, 0);
}

/** 渲染选项（用 DOM API 创建，不使用 innerHTML，避免注入风险） */
function renderOptions(q) {
  const box = $("options");
  box.textContent = ""; /* 清空上一次的选项 */

  q.options.forEach(function (text) {
    const letter = text.trim().charAt(0);
    const label = document.createElement("label");
    label.className = "option";
    label.dataset.letter = letter;

    const input = document.createElement("input");
    input.type = (q.type === "多选") ? "checkbox" : "radio";
    input.name = "option";
    input.value = letter;
    input.addEventListener("change", onOptionChange);

    const span = document.createElement("span");
    span.textContent = text;

    label.appendChild(input);
    label.appendChild(span);
    box.appendChild(label);
  });
}

/** 选项变化时同步 selected 状态并高亮 */
function onOptionChange() {
  if (answered) return;
  const inputs = document.querySelectorAll("#options input");
  selected = [];
  inputs.forEach(function (input) {
    const label = input.parentNode;
    if (input.checked) {
      selected.push(input.value);
      label.classList.add("selected");
    } else {
      label.classList.remove("selected");
    }
  });
  selected.sort();
}

/**
 * 提交答案
 * 判分规则（已拍板 3A）：选项与正确答案完全一致才判对，多选/少选/错选都算错
 */
function submitAnswer() {
  if (answered) return;
  if (selected.length === 0) {
    showToast("请先选择答案");
    return;
  }

  const qid = order[cursor];
  const q = QUESTION_BANK[qid];
  const correct = (selected.join("") === q.answer.join(""));

  answered = true;
  sessionTotal++;
  if (correct) sessionCorrect++;

  /* 锁定选项，并标出正确答案与错选项 */
  const inputs = document.querySelectorAll("#options input");
  inputs.forEach(function (input) {
    input.disabled = true;
    const label = input.parentNode;
    label.classList.remove("selected");
    label.classList.add("disabled");
    if (q.answer.indexOf(input.value) >= 0) {
      label.classList.add("correct");
    } else if (input.checked) {
      label.classList.add("wrong");
    }
  });

  /* 结果提示 */
  const box = $("resultBox");
  box.classList.remove("hidden");
  if (correct) {
    box.className = "result ok";
    box.textContent = "回答正确！";
  } else {
    box.className = "result bad";
    box.textContent = "回答错误。正确答案：" + q.answer.join("") + "；你选的是：" + selected.join("");
  }

  /* 记录成绩（最近一次 + 累计次数），答错进入错题本 */
  recordAnswer(qid, selected, correct);

  /* 错题练习中答对：自动移出错题本 */
  if (correct && mode === "wrong") {
    removeWrong(qid);
    box.textContent += " 本题已自动移出错题本。";
  }

  $("submitBtn").classList.add("hidden");
  const nextBtn = $("nextBtn");
  nextBtn.classList.remove("hidden");
  nextBtn.textContent = (cursor + 1 >= order.length) ? "完成本轮" : "下一题";
  nextBtn.onclick = nextQuestion;
}

/** 写入作答记录 */
function recordAnswer(qid, chosen, correct) {
  const prev = appData.records[qid];
  const attempts = (prev && prev.attempts) ? prev.attempts + 1 : 1;
  appData.records[qid] = {
    selected: chosen.slice(),
    correct: correct,
    attempts: attempts,
    timestamp: Date.now()
  };
  if (!correct) addWrong(qid);
  if (mode === "full") appData.currentIndex = cursor + 1;
  saveJSON(KEY_DATA, appData);
}

/** 下一题 / 完成本轮 */
function nextQuestion() {
  if (cursor + 1 >= order.length) {
    finishSession();
    return;
  }
  cursor++;
  if (mode === "full") {
    appData.currentIndex = cursor;
    saveJSON(KEY_DATA, appData);
  }
  renderQuestion();
}

/** 本轮完成：显示小结，并把按钮改成"返回菜单" */
function finishSession() {
  if (mode === "full") {
    appData.currentIndex = BANK_SIZE;
    saveJSON(KEY_DATA, appData);
  }
  $("quizProgress").textContent = MODE_NAME[mode] + " · 本轮已结束";
  $("questionType").textContent = "";
  $("questionNo").textContent = "";
  $("questionText").textContent = "本轮完成：共做 " + sessionTotal + " 题，答对 " + sessionCorrect +
    " 题，本轮正确率 " + formatPercent(sessionCorrect, sessionTotal) + "。";
  $("options").textContent = "";
  $("resultBox").classList.add("hidden");
  $("submitBtn").classList.add("hidden");

  const nextBtn = $("nextBtn");
  nextBtn.classList.remove("hidden");
  nextBtn.textContent = "返回菜单";
  nextBtn.onclick = backToMenu;
}

/* ============================================================
   七、错题区
   ============================================================ */
/** 加入错题本（错误次数 +1） */
function addWrong(qid) {
  if (wrongData.wrongIndices.indexOf(qid) < 0) {
    wrongData.wrongIndices.push(qid);
    wrongData.wrongIndices.sort(function (a, b) { return a - b; });
  }
  const key = String(qid);
  wrongData.wrongCount[key] = (wrongData.wrongCount[key] || 0) + 1;
  saveJSON(KEY_WRONG, wrongData);
}

/** 移出错题本 */
function removeWrong(qid) {
  const idx = wrongData.wrongIndices.indexOf(qid);
  if (idx >= 0) wrongData.wrongIndices.splice(idx, 1);
  delete wrongData.wrongCount[String(qid)];
  saveJSON(KEY_WRONG, wrongData);
}

/** 打开错题本页面 */
function showWrongBook() {
  hide("menu"); hide("quiz"); hide("stats");
  show("wrongBook");
  renderWrongList();
  window.scrollTo(0, 0);
}

/** 渲染错题列表 */
function renderWrongList() {
  const box = $("wrongList");
  box.textContent = "";
  const ids = wrongData.wrongIndices.slice().sort(function (a, b) { return a - b; });

  if (ids.length === 0) {
    $("wrongBookProgress").textContent = "错题本是空的，先做一遍题目吧";
    return;
  }
  $("wrongBookProgress").textContent = "错题本：共 " + ids.length + " 题";

  ids.forEach(function (qid) {
    const q = QUESTION_BANK[qid];
    const row = document.createElement("div");
    row.className = "wrong-row";

    const title = document.createElement("div");
    title.className = "wrong-title";
    title.textContent = "题库第 " + (qid + 1) + " 题 · " + q.type;

    const detail = document.createElement("div");
    detail.className = "wrong-detail";
    detail.textContent = q.question;

    const meta = document.createElement("div");
    meta.className = "wrong-meta";
    meta.textContent = "正确答案：" + q.answer.join("") + " · 累计答错 " + (wrongData.wrongCount[String(qid)] || 1) + " 次";

    const btn = document.createElement("button");
    btn.className = "btn-secondary small";
    btn.textContent = "移出错题本";
    btn.onclick = function () {
      removeWrong(qid);
      renderWrongList();
      showToast("已移出错题本");
    };

    row.appendChild(title);
    row.appendChild(detail);
    row.appendChild(meta);
    row.appendChild(btn);
    box.appendChild(row);
  });
}

/* ============================================================
   八、统计区
   统计口径（已拍板 4A）：每题按"最近一次作答"计入正确率，同时显示累计作答次数
   ============================================================ */
/** 汇总统计数据 */
function computeStats() {
  const stats = {
    answered: 0, correct: 0, attempts: 0,
    wrong: wrongData.wrongIndices.length,
    byType: { "单选": { answered: 0, correct: 0 }, "多选": { answered: 0, correct: 0 } }
  };

  Object.keys(appData.records).forEach(function (key) {
    const id = Number(key);
    const record = appData.records[key];
    if (!isFinite(id) || id < 0 || id >= BANK_SIZE || !record) return;
    const type = QUESTION_BANK[id].type;
    if (!stats.byType[type]) stats.byType[type] = { answered: 0, correct: 0 };
    stats.answered++;
    stats.attempts += record.attempts || 0;
    stats.byType[type].answered++;
    if (record.correct) {
      stats.correct++;
      stats.byType[type].correct++;
    }
  });
  return stats;
}

/** 生成一张统计卡片 */
function createStatItem(label, value) {
  const item = document.createElement("div");
  item.className = "stat-item";
  const labelEl = document.createElement("div");
  labelEl.className = "stat-label";
  labelEl.textContent = label;
  const valueEl = document.createElement("div");
  valueEl.className = "stat-value";
  valueEl.textContent = value;
  item.appendChild(labelEl);
  item.appendChild(valueEl);
  return item;
}

/** 打开统计页 */
function showStats() {
  hide("menu"); hide("quiz"); hide("wrongBook");
  show("stats");

  const s = computeStats();
  const box = $("statsContent");
  box.textContent = "";

  const grid = document.createElement("div");
  grid.className = "stat-grid";
  grid.appendChild(createStatItem("题库总题数", String(BANK_SIZE)));
  grid.appendChild(createStatItem("已答题数", String(s.answered)));
  grid.appendChild(createStatItem("最近一次正确率", formatPercent(s.correct, s.answered)));
  grid.appendChild(createStatItem("错题数", String(s.wrong)));
  grid.appendChild(createStatItem("累计作答次数", String(s.attempts)));
  grid.appendChild(createStatItem("尚未作答", String(BANK_SIZE - s.answered)));
  box.appendChild(grid);

  const singleTitle = document.createElement("div");
  singleTitle.className = "stat-section";
  singleTitle.textContent = "题型统计";
  box.appendChild(singleTitle);

  const typeGrid = document.createElement("div");
  typeGrid.className = "stat-grid";
  typeGrid.appendChild(createStatItem(
    "单选题（已答 " + s.byType["单选"].answered + " 题）",
    formatPercent(s.byType["单选"].correct, s.byType["单选"].answered)
  ));
  typeGrid.appendChild(createStatItem(
    "多选题（已答 " + s.byType["多选"].answered + " 题）",
    formatPercent(s.byType["多选"].correct, s.byType["多选"].answered)
  ));
  box.appendChild(typeGrid);

  const hint = document.createElement("div");
  hint.className = "hint";
  hint.textContent = "正确率按每题最近一次作答计算；错题重练答对后，正确率会随之提高。";
  box.appendChild(hint);

  window.scrollTo(0, 0);
}

/* ============================================================
   九、清空记录
   ============================================================ */
function resetAll() {
  const ok = window.confirm("确定清空所有记录吗？\n\n将清除：顺序练习进度、错题本、统计记录。\n此操作无法撤销。");
  if (!ok) return;

  removeRaw(KEY_DATA);
  removeRaw(KEY_WRONG);
  removeRaw(KEY_SETTINGS);

  appData = defaultData();
  wrongData = defaultWrong();
  settings = defaultSettings();
  order = [];
  cursor = 0;
  selected = [];
  answered = false;
  sessionTotal = 0;
  sessionCorrect = 0;

  hide("quiz"); hide("stats"); hide("wrongBook");
  show("menu");
  updateMenuProgress();
  showToast("已清空所有记录，可以重新开始");
}

/* ============================================================
   十、初始化区
   ============================================================ */
function init() {
  if (BANK_SIZE === 0) {
    $("menuProgress").textContent = "题库数据异常（0 题），请重新生成 index.html";
    return;
  }
  updateMenuProgress();
}

window.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
